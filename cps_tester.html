<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>High-Speed CPS Tester</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin-top: 30px; 
            background-color: #121212; 
            color: #ffffff; 
        }
        #setup-area {
            margin-bottom: 20px;
            font-size: 18px;
        }
        input[type="number"] {
            width: 60px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #4CAF50;
            background-color: #1e1e1e;
            color: white;
            border-radius: 4px;
        }
        #time-display {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ff9800;
            font-weight: bold;
        }
        #click-area { 
            width: 500px; 
            height: 250px; 
            background-color: #1e1e1e; 
            border: 3px dashed #4CAF50; 
            border-radius: 10px;
            margin: 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            cursor: crosshair; 
            user-select: none;
        }
        .locked {
            border-color: #d32f2f !important;
            background-color: #2c1010 !important;
            color: #ff5252;
        }
        #stats { 
            margin-top: 20px; 
            font-size: 24px; 
        }
        .highlight {
            color: #4CAF50;
            font-weight: bold;
        }
        button { 
            margin-top: 20px; 
            padding: 10px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background-color: #b71c1c; }
    </style>
</head>
<body>
    <h2>Local Max-Speed CPS Counter</h2>
    
    <div id="setup-area">
        <label for="time-limit">Test Duration (Seconds): </label>
        <input type="number" id="time-limit" value="10" min="1" max="100">
    </div>

    <div id="time-display">Time Left: 10.0s</div>
    
    <div id="click-area">Target Area</div>
    
    <div id="stats">
        <p>Total Clicks: <span id="click-count" class="highlight">0</span></p>
        <p>Final Speed: <span id="cps-count" class="highlight">0.00</span> CPS</p>
    </div>
    
    <button onclick="resetCounter()">Reset Test</button>

    <script>
        let clicks = 0;
        let startTime = null;
        let isRunning = false;
        let timerInterval = null;
        let testDuration = 10;
        
        const clickArea = document.getElementById('click-area');
        const clickCountDisplay = document.getElementById('click-count');
        const cpsCountDisplay = document.getElementById('cps-count');
        const timeDisplay = document.getElementById('time-display');
        const timeInput = document.getElementById('time-limit');

        // Update the visual timer instantly if the user types a new number
        timeInput.addEventListener('input', function() {
            if (!isRunning && clicks === 0) {
                timeDisplay.textContent = `Time Left: ${parseFloat(this.value).toFixed(1)}s`;
            }
        });

        clickArea.addEventListener('mousedown', function(e) {
            // Start the timer on the very first click
            if (!isRunning && clicks === 0) {
                isRunning = true;
                testDuration = parseFloat(timeInput.value);
                startTime = performance.now();
                clickArea.textContent = "Tapping...";
                
                // Background countdown loop
                timerInterval = setInterval(() => {
                    let elapsed = (performance.now() - startTime) / 1000;
                    let timeLeft = testDuration - elapsed;
                    
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        isRunning = false;
                        clearInterval(timerInterval);
                        
                        // Lock the UI and show final results
                        clickArea.classList.add('locked');
                        clickArea.textContent = "TEST FINISHED";
                        
                        let finalElapsed = (performance.now() - startTime) / 1000;
                        clickCountDisplay.textContent = clicks;
                        cpsCountDisplay.textContent = (clicks / testDuration).toFixed(2);
                    }
                    
                    timeDisplay.textContent = `Time Left: ${timeLeft.toFixed(1)}s`;
                }, 100); // Updates the timer visually 10 times a second
            }

            // If the timer has hit zero, ignore all future clicks
            if (!isRunning) return;

            clicks++;
            
            // Batch the visual updates for the clicks so it doesn't crash your PC
            if (clicks % 15 === 0) {
                let elapsedSeconds = (performance.now() - startTime) / 1000;
                clickCountDisplay.textContent = clicks;
                cpsCountDisplay.textContent = (clicks / elapsedSeconds).toFixed(2);
            }
        });

        function resetCounter() {
            clicks = 0;
            startTime = null;
            isRunning = false;
            clearInterval(timerInterval);
            
            clickArea.classList.remove('locked');
            clickArea.textContent = "Target Area";
            
            let val = parseFloat(timeInput.value);
            timeDisplay.textContent = `Time Left: ${val.toFixed(1)}s`;
            
            clickCountDisplay.textContent = '0';
            cpsCountDisplay.textContent = '0.00';
        }
    </script>
</body>
</html>
